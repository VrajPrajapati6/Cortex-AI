<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F1219" />
      <stop offset="100%" stop-color="#050507" />
    </linearGradient>

    <!-- Glowing C Stroke Gradient -->
    <linearGradient id="cortexGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>

    <!-- Emerald Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Rounded Base Badge -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="url(#bgGrad)" stroke="#27272A" stroke-width="12" />

  <!-- Inner Subtle Grid Lines -->
  <path d="M128 32v448M384 32v448M32 128h448M32 384h448" stroke="#18181B" stroke-width="6" opacity="0.6" />

  <!-- Node Connection Web Lines -->
  <path d="M 330 160 L 210 160 L 160 256 L 210 352 L 330 352" fill="none" stroke="url(#cortexGrad)" stroke-width="44" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Connected Neural Telemetry Node Dots -->
  <circle cx="340" cy="160" r="22" fill="#10B981" filter="url(#glow)" />
  <circle cx="160" cy="256" r="24" fill="#3B82F6" filter="url(#glow)" />
  <circle cx="340" cy="352" r="22" fill="#10B981" filter="url(#glow)" />
  <circle cx="256" cy="110" r="14" fill="#F59E0B" />
</svg>